<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งรหัสผ่านใหม่ | Crust&Cream</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#faf7f2;padding:24px}
    .reset-card{width:min(100%,440px);background:#fff;border:1px solid #eadfd3;border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(65,42,25,.08)}
    .reset-card h1{margin:0 0 10px;color:#543b31;font-size:26px}
    .reset-card p{color:#76675e;line-height:1.65}
    .reset-card label{display:block;margin:18px 0 7px;color:#543b31;font-weight:600}
    .reset-card input{width:100%;padding:13px;border:1px solid #d9c9bb;border-radius:10px;font:inherit}
    .reset-card button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#7b5142;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    .reset-card button:disabled{opacity:.55;cursor:not-allowed}
    #reset-message{min-height:48px;margin-top:18px}
    #back-admin{display:block;text-align:center;margin-top:14px;color:#7b5142}
  </style>
</head>
<body data-page="reset">
  <main class="reset-card">
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <p>Crust&Cream Admin</p>
    <p id="reset-message">กำลังตรวจสอบลิงก์รีเซ็ตรหัสผ่าน...</p>
    <form id="reset-form">
      <label for="password">รหัสผ่านใหม่</label>
      <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required placeholder="อย่างน้อย 6 ตัวอักษร">
      <label for="confirm_password">ยืนยันรหัสผ่านใหม่</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="6" autocomplete="new-password" required placeholder="กรอกรหัสผ่านอีกครั้ง">
      <button id="reset-submit" type="submit">บันทึกรหัสผ่านใหม่</button>
    </form>
    <a id="back-admin" href="admin-desktop.html" hidden>กลับไปหน้าเข้าสู่ระบบ Admin</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
